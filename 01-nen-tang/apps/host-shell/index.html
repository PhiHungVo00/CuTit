<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF3E4" />
    <meta name="color-scheme" content="dark light" /><!-- màu theo token; không đổi lúc chạy để tránh tính lại style toàn trang -->
    <meta name="description" content="Học tiếng Việt cùng Bé Cu Tít: xưng hô, phát âm 6 thanh, hội thoại" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bé Cu Tít" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Học Tiếng Việt Cùng Bé Cu Tít</title>
    <script>
      // Gắn giao diện đã lưu TRƯỚC lần vẽ đầu tiên (tránh chớp). Đồng bộ với theme/deviceBindings.ts:
      // đọc deviceSettings (becutit.device), rơi về khóa cũ becutit.theme, mặc định sáng; 'system' theo media.
      // Luôn gắn để ThemeProvider không phải đổi thuộc tính trên <html> sau khi vẽ (buộc tính lại style toàn trang).
      var d = document.documentElement, t = 'light', m = false;
      try {
        var s = JSON.parse(localStorage.getItem('becutit.device') || 'null');
        s = s && s.state;
        var c = s && s.theme;
        if (!c) c = localStorage.getItem('becutit.theme') === 'dark' ? 'dark' : 'light';
        t = c === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : c === 'dark' ? 'dark' : 'light';
        m = !!(s && s.reducedMotion);
      } catch (e) {}
      d.dataset.theme = t;
      if (m) d.dataset.reducedMotion = 'true';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ứng dụng cần bật JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
