<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16100B" />
    <meta name="color-scheme" content="dark light" /><!-- màu theo token; không đổi lúc chạy để tránh tính lại style toàn trang -->
    <meta name="description" content="Học tiếng Việt cùng Bé Cu Tít: xưng hô, phát âm 6 thanh, hội thoại" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bé Cu Tít" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Học Tiếng Việt Cùng Bé Cu Tít</title>
    <script>
      // Gắn giao diện đã lưu TRƯỚC lần vẽ đầu tiên (tránh chớp tối rồi mới sáng). Đồng bộ với ThemeContext.tsx
      // Luôn gắn (mặc định 'dark') để ThemeProvider không phải đổi thuộc tính trên <html> sau khi vẽ:
      // đổi thuộc tính ở gốc tài liệu buộc trình duyệt tính lại style TOÀN trang (đo được bằng Lighthouse).
      var t = 'dark';
      try {
        var s = localStorage.getItem('becutit.theme');
        if (s === 'light' || s === 'dark') t = s;
      } catch (e) {}
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ứng dụng cần bật JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
