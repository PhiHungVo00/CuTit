<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Học Tiếng Việt Cùng Bé Cu Tít - Host Shell</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇻🇳</text></svg>" />
    <!-- Google Fonts: Be Vietnam Pro & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!-- Tailwind CSS with Stitch Theme Palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#ffb4aa',
              'primary-container': '#e56c5e',
              'on-primary': '#640b08',
              'on-primary-container': '#5a0304',
              secondary: '#9acde9',
              'secondary-container': '#0f4c64',
              'on-secondary': '#003548',
              'on-secondary-container': '#89bcd7',
              tertiary: '#f8bc4b',
              'tertiary-container': '#bc8714',
              'tertiary-fixed': '#ffdeaa',
              'on-tertiary-fixed': '#271900',
              'on-tertiary-fixed-variant': '#5f4100',
              'on-tertiary-container': '#392600',
              surface: '#220e07',
              'surface-container': '#301a12',
              'surface-container-high': '#3c241b',
              'surface-container-highest': '#482f25',
              'surface-container-lowest': '#1c0904',
              'surface-variant': '#482f25',
              'on-surface': '#ffdbcf',
              'on-surface-variant': '#dec0bc',
              outline: '#a58b87',
              'outline-variant': '#57423f'
            },
            fontFamily: {
              sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    </script>
    <style>
      @layer base {
        html,
        body {
          width: 100%;
          margin: 0;
          padding: 0;
          -webkit-tap-highlight-color: transparent;
        }
        body {
          overscroll-behavior-y: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      /* ===== Giao diện sáng/tối cho chrome mobile (tokens theo data-skin trên <html>) =====
         Mặc định = bảng tối M3 Stitch (nguyên trạng). Light = bảng ngà ấm khớp chuẩn nền sáng 12 màn MFE. */
      :root {
        --bg-page: #190a05;
        --bg-elev: #0f0502;
        --bg-card: #200d07;
        --bg-card2: #260f08;
        --bg-card3: #2a130c;
        --bg-card4: #1e0a05;
        --bg-raised: #3b1a10;
        --line-soft: #3b1a10;
        --line: #482014;
        --tx: #ffdbcf;
        --tx-muted: #cca79b;
        --tx-faint: #a15f4f;
        --tx-dim: #a58b87;
        --tx-soft: #ffb4aa;
        --tx-strong: #ffffff;
        --ok: #4ade80;
        --sky: #38bdf8;
        --sky-soft: #9acde9;
        --amber: #f8bc4b;
        --coral: #e56c5e;
        --badge-bg: #082f49;
        --badge-tx: #7dd3fc;
        --badge-line: #1e40af;
      }

      html[data-skin="light"] {
        /* Bảng light khớp chuẩn nền sáng của 12 màn MFE (M9/M12=#fcf9f2, M11=#fff8f6, M3=#FFFBF5) */
        --bg-page: #fcf9f2;
        --bg-elev: #fffbf5;
        --bg-card: #fff8f6;
        --bg-card2: #fef3e9;
        --bg-card3: #f8e8dc;
        --bg-card4: #f3ddd0;
        --bg-raised: #eddfcf;
        --line-soft: #efdcce;
        --line: #e2c9b8;
        --tx: #220e07;
        --tx-muted: #7c584a;
        --tx-faint: #a6877a;
        --tx-dim: #8f6f5f;
        --tx-soft: #b3574a;
        --tx-strong: #220e07;
        --ok: #15803d;
        --sky: #0369a1;
        --sky-soft: #0e7490;
        --amber: #b45309;
        --coral: #c2410c;
        --badge-bg: #e0f2fe;
        --badge-tx: #075985;
        --badge-line: #7dd3fc;
      }
      ::-webkit-scrollbar {
        display: none;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-[var(--bg-page)] text-[var(--tx)] font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
