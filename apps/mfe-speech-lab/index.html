<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Bé Cu Tít - Phòng Luyện Âm & Phương Ngữ (M2 & M6)</title>

    <!-- Google Fonts: Be Vietnam Pro & Material Symbols Outlined -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <!-- Tailwind CSS with Stitch Theme Palette -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#ffb4aa',
              'primary-container': '#e56c5e',
              'on-primary': '#640b08',
              'on-primary-container': '#5a0304',
              secondary: '#9acde9',
              'secondary-container': '#0f4c64',
              'on-secondary': '#003548',
              'on-secondary-container': '#89bcd7',
              tertiary: '#f8bc4b',
              'tertiary-container': '#bc8714',
              'tertiary-fixed': '#ffdeaa',
              'on-tertiary-fixed': '#271900',
              'on-tertiary-fixed-variant': '#5f4100',
              'on-tertiary-container': '#392600',
              surface: '#220e07',
              'surface-container': '#301a12',
              'surface-container-high': '#3c241b',
              'surface-container-highest': '#482f25',
              'surface-container-lowest': '#1c0904',
              'surface-variant': '#482f25',
              'on-surface': '#ffdbcf',
              'on-surface-variant': '#dec0bc',
              outline: '#a58b87',
              'outline-variant': '#57423f'
            },
            fontFamily: {
              sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
            }
          }
        }
      };
    </script>
    <style>
      @layer base {
        html,
        body {
          width: 100%;
          margin: 0;
          padding: 0;
          -webkit-tap-highlight-color: transparent;
        }
        body {
          overscroll-behavior-y: none;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 16px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
      }
    </style>
  </head>
  <body class="bg-[#220e07] text-[#ffdbcf] font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
