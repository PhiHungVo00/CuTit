<h2>10 câu, đủ 80% là qua unit</h2>
<p>Không làm lại câu sai trong bài kiểm tra. Đúng từ 80% trở lên thì mọi bài trong unit được tính là đã xong.</p>
<ol class="steps">
<li><span class="n">1</span>Từ trang unit, bấm “Kiểm tra để vượt unit”.</li>
<li><span class="n">2</span>Bấm “Bắt đầu kiểm tra” (10 câu).</li>
<li><span class="n">3</span>Đạt 80% là qua; chưa đạt thì học lại.</li>
</ol>
<span class="pill ok">Đã xong</span>
